<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão da Copa — Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

/* ============ TOKENS ============ */
:root{
  --grama:#0F3D2E;
  --grama-escura:#0A2A20;
  --giz:#F2EFE6;
  --ouro:#E8B94B;
  --vermelho:#C23B22;
  --tinta:#152018;
  --linha: rgba(242,239,230,0.14);
  --sombra-cartao: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:
    radial-gradient(circle at 15% 0%, rgba(232,185,75,0.07), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,0.025) 39px 40px),
    var(--grama);
  color:var(--giz);
  font-family:'Space Grotesk', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3{font-family:'Archivo Black', sans-serif; font-weight:400; letter-spacing:-0.01em; margin:0;}
.mono{font-family:'JetBrains Mono', monospace;}

a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

/* Linhas de campo decorativas no fundo */
.linhas-campo{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  background-image:
    linear-gradient(90deg, transparent 49.6%, var(--linha) 49.6% 50.4%, transparent 50.4%);
}
.linhas-campo::before{
  content:''; position:absolute; top:50%; left:50%; width:140px; height:140px;
  border:1px solid var(--linha); border-radius:50%; transform:translate(-50%,-50%);
}

.app{position:relative; z-index:1; max-width:880px; margin:0 auto; padding:20px 16px 80px;}

/* ============ HEADER ============ */
.topo{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 4px 22px; border-bottom:2px dashed var(--linha); margin-bottom:22px;
}
.marca{display:flex; align-items:center; gap:12px;}
.marca .bola{
  width:38px; height:38px; border-radius:50%;
  background: conic-gradient(from 0deg, var(--giz) 0 60deg, var(--tinta) 60deg 120deg, var(--giz) 120deg 180deg, var(--tinta) 180deg 240deg, var(--giz) 240deg 300deg, var(--tinta) 300deg 360deg);
  box-shadow: inset 0 0 0 2px var(--tinta), 0 4px 10px rgba(0,0,0,0.4);
  flex-shrink:0;
}
.marca h1{font-size:22px; line-height:1.05;}
.marca .sub{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ouro); margin-top:2px;}
.usuario-chip{
  display:flex; align-items:center; gap:8px;
  background:rgba(0,0,0,0.25); border:1px solid var(--linha);
  border-radius:40px; padding:6px 14px 6px 6px;
}
.usuario-chip img{width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid var(--ouro);}
.usuario-chip span{font-size:13px; font-weight:600;}
.usuario-chip button{
  background:none; border:none; color:rgba(242,239,230,0.5); font-size:11px;
  text-decoration:underline; padding:0; margin-left:4px;
}

/* ============ NAV (abas) ============ */
.abas{display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap;}
.aba-btn{
  background:transparent; border:1px solid var(--linha); color:var(--giz);
  padding:9px 16px; border-radius:30px; font-size:13px; font-weight:600;
  letter-spacing:0.01em; transition: all .15s ease;
}
.aba-btn.ativa{background:var(--ouro); color:var(--grama-escura); border-color:var(--ouro);}
.aba-btn:not(.ativa):hover{border-color:var(--ouro); color:var(--ouro);}

/* ============ TELA LOGIN ============ */
.tela-login{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:70vh; text-align:center;
}
.tela-login .titulo-grande{font-size:36px; line-height:1.08; margin-bottom:10px;}
.tela-login .titulo-grande .destaque{color:var(--ouro);}
.tela-login p.legenda{color:rgba(242,239,230,0.65); font-size:14px; margin-bottom:32px; max-width:380px;}

.grade-participantes{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; width:100%; max-width:420px;
}
.cartao-participante{
  background:rgba(0,0,0,0.25); border:1px solid var(--linha); border-radius:var(--radius);
  padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:8px;
  transition: transform .15s ease, border-color .15s ease;
}
.cartao-participante:hover{transform:translateY(-3px); border-color:var(--ouro);}
.cartao-participante img{
  width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--linha);
}
.cartao-participante span{font-size:12px; font-weight:600; line-height:1.2;}

/* ============ CARTÕES DE JOGO ============ */
.lista-jogos{display:flex; flex-direction:column; gap:12px;}

.cartao-jogo{
  background:rgba(0,0,0,0.22); border:1px solid var(--linha); border-radius:var(--radius);
  padding:16px; box-shadow:var(--sombra-cartao);
}
.cartao-jogo.travado{opacity:0.72;}
.cartao-jogo.finalizado{border-color:rgba(232,185,75,0.35);}

.linha-meta{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(242,239,230,0.55);
}
.tag-fase{
  background:rgba(232,185,75,0.14); color:var(--ouro); padding:3px 9px; border-radius:20px; font-weight:600;
}
.tag-status{padding:3px 9px; border-radius:20px; font-weight:600;}
.tag-status.aberto{background:rgba(76,175,80,0.16); color:#8fd99a;}
.tag-status.travado{background:rgba(242,239,230,0.08); color:rgba(242,239,230,0.5);}
.tag-status.final{background:rgba(232,185,75,0.18); color:var(--ouro);}

.confronto{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
}
.time{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;}
.time .nome-time{font-size:14px; font-weight:600; line-height:1.2;}

.placar-input-grupo{display:flex; align-items:center; gap:8px;}
.placar-input{
  width:48px; height:48px; text-align:center; font-size:20px; font-weight:700;
  background:var(--tinta); border:1px solid var(--linha); border-radius:10px; color:var(--giz);
  font-family:'JetBrains Mono', monospace;
}
.placar-input:focus{outline:none; border-color:var(--ouro);}
.placar-input:disabled{color:rgba(242,239,230,0.45); background:rgba(0,0,0,0.2);}
.versus{font-size:11px; color:rgba(242,239,230,0.4); font-weight:600;}

.placar-real-exibe{
  display:flex; align-items:center; gap:8px; justify-content:center;
}
.placar-real-num{
  font-size:22px; font-weight:700; font-family:'JetBrains Mono', monospace; color:var(--ouro);
}

.rodape-jogo{
  display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px;
  border-top:1px dashed var(--linha); font-size:12px;
}
.btn-salvar{
  background:var(--ouro); color:var(--grama-escura); border:none; padding:8px 16px;
  border-radius:8px; font-weight:700; font-size:12px;
}
.btn-salvar:hover{filter:brightness(1.08);}
.btn-salvar:disabled{background:rgba(242,239,230,0.12); color:rgba(242,239,230,0.4); cursor:not-allowed;}

.resultado-palpite-tag{font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;}
.resultado-palpite-tag.pts-3{background:rgba(76,175,80,0.18); color:#8fd99a;}
.resultado-palpite-tag.pts-1{background:rgba(232,185,75,0.18); color:var(--ouro);}
.resultado-palpite-tag.pts-0{background:rgba(194,59,34,0.18); color:#e98a76;}
.aviso-travado{color:rgba(242,239,230,0.45); font-size:12px; font-style:italic;}

/* ============ QUEM JÁ PALPITOU ============ */
.grade-todos-palpites{display:flex; flex-direction:column; gap:6px;}
.linha-palpite-todos{
  display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:10px;
  padding:7px 8px; border-radius:8px; background:rgba(0,0,0,0.12);
}
.linha-palpite-todos img{width:28px; height:28px; border-radius:50%; object-fit:cover;}
.nome-palpite-todos{font-size:13px; font-weight:600;}
.valor-palpite-todos{font-size:13px; text-align:right; display:flex; align-items:center; gap:4px;}
.check-palpitou{color:#8fd99a; font-weight:600; font-size:12px;}
.check-faltou{color:rgba(242,239,230,0.4); font-size:12px;}
.placar-revelado{font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--ouro);}

/* ============ MODAL DE PIN ============ */
.overlay-pin{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-pin{
  background:var(--grama-escura); border:1px solid var(--linha); border-radius:16px;
  padding:24px; width:100%; max-width:300px; text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
.modal-pin img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--ouro);}
.pin-input{
  width:100%; text-align:center; font-size:28px; letter-spacing:14px; font-family:'JetBrains Mono', monospace;
  background:var(--tinta); border:1px solid var(--linha); border-radius:10px; color:var(--giz);
  padding:12px 0 12px 14px;
}
.pin-input:focus{outline:none; border-color:var(--ouro);}
.pin-erro{color:#e98a76; font-size:12px; min-height:16px; margin-top:8px;}

/* ============ RANKING ============ */
.podio{display:flex; gap:10px; align-items:flex-end; margin-bottom:24px; justify-content:center;}
.pod-item{display:flex; flex-direction:column; align-items:center; gap:8px;}
.pod-item img{border-radius:50%; object-fit:cover; border:3px solid var(--ouro);}
.pod-item.p1 img{width:78px; height:78px;}
.pod-item.p2 img, .pod-item.p3 img{width:60px; height:60px; border-color:rgba(242,239,230,0.4);}
.pod-base{
  background:rgba(0,0,0,0.3); border:1px solid var(--linha); border-radius:8px 8px 0 0;
  width:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 4px;
}
.pod-item.p1 .pod-base{height:90px; border-top:3px solid var(--ouro);}
.pod-item.p2 .pod-base{height:64px;}
.pod-item.p3 .pod-base{height:46px;}
.pod-base .posicao{font-family:'Archivo Black', sans-serif; font-size:22px; color:var(--ouro);}
.pod-item .nome-pod{font-size:12px; font-weight:600; text-align:center; max-width:88px;}
.pod-item .pts-pod{font-size:11px; color:rgba(242,239,230,0.6);}

.tabela-ranking{display:flex; flex-direction:column; gap:8px;}
.linha-ranking{
  display:grid; grid-template-columns:28px 40px 1fr auto; align-items:center; gap:12px;
  background:rgba(0,0,0,0.2); border:1px solid var(--linha); border-radius:10px; padding:10px 14px;
}
.linha-ranking.voce{border-color:var(--ouro); background:rgba(232,185,75,0.06);}
.linha-ranking .pos-num{font-family:'JetBrains Mono', monospace; font-weight:700; color:rgba(242,239,230,0.5); text-align:center;}
.linha-ranking img{width:40px; height:40px; border-radius:50%; object-fit:cover;}
.info-ranking .nome-r{font-weight:600; font-size:14px;}
.info-ranking .detalhe-r{font-size:11px; color:rgba(242,239,230,0.5); margin-top:1px;}
.pts-total{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; color:var(--ouro); text-align:right;}
.pts-total span{font-size:10px; display:block; color:rgba(242,239,230,0.4); font-weight:400; font-family:'Space Grotesk',sans-serif;}

/* ============ ADMIN ============ */
.painel-admin{display:flex; flex-direction:column; gap:18px;}
.bloco-admin{
  background:rgba(0,0,0,0.22); border:1px solid var(--linha); border-radius:var(--radius); padding:18px;
}
.bloco-admin h3{font-size:14px; margin-bottom:14px; color:var(--ouro); letter-spacing:0.02em;}
.campo{margin-bottom:12px;}
.campo label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:rgba(242,239,230,0.55); margin-bottom:5px;}
.campo input, .campo select{
  width:100%; background:var(--tinta); border:1px solid var(--linha); border-radius:8px;
  padding:10px 12px; color:var(--giz); font-size:14px; font-family:inherit;
}
.campo input:focus, .campo select:focus{outline:none; border-color:var(--ouro);}
.grade-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn-primario{
  background:var(--ouro); color:var(--grama-escura); border:none; padding:11px 18px;
  border-radius:8px; font-weight:700; font-size:13px; width:100%;
}
.btn-primario:hover{filter:brightness(1.08);}
.btn-secundario{
  background:transparent; border:1px solid var(--linha); color:var(--giz);
  padding:9px 14px; border-radius:8px; font-size:12px; font-weight:600;
}
.btn-perigo{color:#e98a76; border-color:rgba(194,59,34,0.4);}

.lista-jogos-admin{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
.item-jogo-admin{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:rgba(0,0,0,0.18); border:1px solid var(--linha); border-radius:8px; padding:10px 12px;
  font-size:12px;
}
.item-jogo-admin .info-jogo-admin{flex:1; min-width:0;}
.item-jogo-admin .nome-confronto{font-weight:600; font-size:13px;}
.item-jogo-admin .meta-confronto{color:rgba(242,239,230,0.5); font-size:11px; margin-top:2px;}
.acoes-jogo-admin{display:flex; gap:6px; flex-shrink:0;}
.acoes-jogo-admin button{padding:6px 10px; font-size:11px;}

/* ============ ESTADOS ============ */
.vazio{
  text-align:center; padding:50px 20px; color:rgba(242,239,230,0.5); font-size:14px;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--ouro); color:var(--grama-escura); padding:11px 22px; border-radius:30px;
  font-weight:700; font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease;
  box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:50; white-space:nowrap; max-width:90vw;
}
.toast.erro{background:var(--vermelho); color:var(--giz);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.carregando{text-align:center; padding:60px 0; color:rgba(242,239,230,0.5); font-size:13px;}

::selection{background:var(--ouro); color:var(--grama-escura);}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

@media (max-width:520px){
  .grade-participantes{grid-template-columns:repeat(2,1fr);}
  .marca h1{font-size:18px;}
  .tela-login .titulo-grande{font-size:28px;}
}
</style>
</head>
<body>

<div class="linhas-campo"></div>

<div id="app" class="app">
  <div class="carregando">Carregando bolão…</div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
